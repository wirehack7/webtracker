<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webtracker</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <h1>webtracker</h1>
      <label class="button">
        MOD/XM laden
        <input id="file" type="file" accept=".mod,.xm,.stk" hidden />
      </label>
      <button id="play-song" type="button" disabled>Play Song</button>
      <button id="play-pattern" type="button" disabled>Play Pattern</button>
      <button id="stop" type="button" disabled>Stop</button>
      <button id="prev-order" type="button" disabled title="Vorherige Position">&laquo;</button>
      <button id="next-order" type="button" disabled title="Nächste Position">&raquo;</button>
      <span class="status" id="status">Modul hier ablegen oder laden. Ohne Modul spielen Y–M und Q–U Noten (F1–F7 Oktave).</span>
    </header>

    <main>
      <aside id="instruments">
        <dl class="song-info">
          <dt>Titel</dt><dd id="song-title">-</dd>
          <dt>Format</dt><dd id="song-format">-</dd>
          <dt>Kanäle</dt><dd id="song-channels">-</dd>
          <dt>Position</dt><dd id="song-position">-</dd>
          <dt>Speed/BPM</dt><dd id="song-speed">-</dd>
          <dt>Note</dt><dd id="note">---</dd>
        </dl>
        <ol id="instrument-list" class="instrument-list"></ol>
      </aside>

      <section id="pattern">
        <div id="meters" class="meters"></div>
        <div id="pattern-view" class="pattern-view"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
