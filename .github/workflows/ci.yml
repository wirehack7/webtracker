name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push replaces the run still going for the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung browser must fail the run, not hold it for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          echo '## Unit test coverage' >> "$GITHUB_STEP_SUMMARY"
          node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
      - run: pnpm build
      # The browser downloads are the slowest step; keep them between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browsers
        timeout-minutes: 15
        # A download sometimes hangs; give each try four minutes and try again.
        run: |
          for try in 1 2 3; do
            timeout 240 pnpm exec playwright install --with-deps chromium webkit firefox && exit 0
            echo "Browser install try $try failed, retrying"
          done
          exit 1
      - run: pnpm smoke smoke-screenshots
      - name: Firefox smoke test
        if: always()
        timeout-minutes: 5
        run: pnpm smoke smoke-screenshots/firefox --firefox
      - name: iPhone and iPad smoke test (WebKit)
        if: always()
        timeout-minutes: 5
        run: pnpm smoke:ios smoke-screenshots/ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-screenshots/
