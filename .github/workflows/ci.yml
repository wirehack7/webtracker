name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push replaces the run still going for the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Playwright's image has the browsers and their system libraries, so no step waits on
    # apt mirrors or the browser CDN. Keep its tag at the playwright version in package.json.
    # The runner's user (1001) owns the workspace; Firefox also refuses to run as root.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    # A hung browser must fail the run, not hold it for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          echo '## Unit test coverage' >> "$GITHUB_STEP_SUMMARY"
          node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
      - run: pnpm build
      - run: pnpm smoke smoke-screenshots
      - name: Dialogs on phones
        if: always()
        timeout-minutes: 5
        run: pnpm smoke:dialogs smoke-screenshots/dialogs
      - name: Firefox smoke test
        if: always()
        timeout-minutes: 5
        run: pnpm smoke smoke-screenshots/firefox --firefox
      - name: iPhone and iPad smoke test (WebKit)
        if: always()
        timeout-minutes: 5
        run: pnpm smoke:ios smoke-screenshots/ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-screenshots/
