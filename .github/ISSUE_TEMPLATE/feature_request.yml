name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the task or workflow, not only the solution. "When I build a drum loop I have to ..." helps more than "add button X".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could chiptrackr support it? Keys, menus, effects, behaviour of other trackers you are used to ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Pattern editor
        - Sample editor
        - Instrument editor
        - Playback / effects
        - File formats
        - Audio export
        - Songs, sharing, Jam
        - Replayer for intros
        - Phone and tablet
        - Keyboard shortcuts
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, mockups, links, example modules.
